name: "@keploy/sdk publish"

# Publishes @keploy/sdk, the package at the repository's root, to npm from a
# tag.
#
# To release X.Y.Z: set "version": "X.Y.Z" in package.json on main (a pull
# request, so the check below runs on it), then push the tag sdk-vX.Y.Z on
# that commit. The publish refuses a tag that does not name package.json's
# version (scripts/release-version.mjs); npm itself refuses a version it
# already has. Every action this workflow runs is pinned by commit: the
# publish job holds the npm token and signs the package's provenance.
#
# The package is packed once, and that tarball is checked and then published,
# so what ships is what was checked. The license check
# (scripts/license-gate.mjs) installs the tarball as a user's `npm install`
# does, for each platform users run, and refuses it when any installed
# package's license field, or any installed file, names a license outside
# its allow-list. test/workflows.test.mjs holds every publish workflow to
# this: the tarball the Licenses step checked is the one published.
#
# Push sdk-vX.Y.Z as a plain git tag, never as a GitHub release: a published
# GitHub release starts any workflow of this repository that runs on
# releases.
#
# On a pull request the same tarball is packed and checked, with no token.
on:
  push:
    tags: ["sdk-v*"]
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "keployCli.ts"
      - "v2/**"
      - "scripts/**"
      - "test/**"
      - ".github/workflows/sdk-publish.yml"

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm --provenance signs the package with this run's identity
    defaults:
      run:
        shell: bash # -eo pipefail: a failed command before a pipe fails the step
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # Writes the token line for registry.npmjs.org and pins the @keploy
          # scope to it (@keploy:registry), in the runner's own npmrc.
          registry-url: https://registry.npmjs.org
          scope: "@keploy"
      - name: The tag names package.json's version
        run: node scripts/release-version.mjs "$GITHUB_REF_NAME"
      - name: The npm token is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NPM_TOKEN" || { echo "::error::the NPM_TOKEN secret is not set; refusing to publish"; exit 1; }
      - name: The @keploy scope publishes to registry.npmjs.org
        # npm sends a scoped package to its scope's registry, whatever
        # --registry says. Read the setting npm will use, with every npmrc in
        # it (a project one included), and refuse any other.
        run: |
          got=$(npm config get @keploy:registry)
          test "$got" = https://registry.npmjs.org/ || { echo "::error::@keploy:registry is '$got', not https://registry.npmjs.org/; refusing to publish"; exit 1; }
      - run: npm ci
      - name: Rows
        run: node --test test/*.test.mjs
      - name: Pack
        id: pack
        # prepare builds dist/ first.
        run: |
          name=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          test -f "$RUNNER_TEMP/$name" || { echo "::error::npm pack wrote no $name"; exit 1; }
          echo "tarball=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
      - name: The package carries its build
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/files.txt"
          for f in dist/keployCli.js dist/keployCli.d.ts dist/v2/dedup/register.js dist/v2/dedup/middleware.js package.json README.MD LICENSE; do
            grep -qx "package/$f" "$RUNNER_TEMP/files.txt" || { echo "::error::the package would ship without $f"; exit 1; }
          done
      - name: Licenses
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/license-gate.mjs "$TARBALL"
      - name: The token authenticates
        # Fails here, named, on a token that is expired, revoked or pasted
        # with a stray character, before anything is uploaded.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry https://registry.npmjs.org/
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --provenance

  check:
    name: pack and license check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # -eo pipefail: a failed command before a pipe fails the step
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Rows
        run: node --test test/*.test.mjs
      - name: Pack
        id: pack
        # prepare builds dist/ first.
        run: |
          name=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          test -f "$RUNNER_TEMP/$name" || { echo "::error::npm pack wrote no $name"; exit 1; }
          echo "tarball=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
      - name: The package carries its build
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/files.txt"
          for f in dist/keployCli.js dist/keployCli.d.ts dist/v2/dedup/register.js dist/v2/dedup/middleware.js package.json README.MD LICENSE; do
            grep -qx "package/$f" "$RUNNER_TEMP/files.txt" || { echo "::error::the package would ship without $f"; exit 1; }
          done
      - name: Licenses
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/license-gate.mjs "$TARBALL"
