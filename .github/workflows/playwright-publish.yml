name: "@keploy/playwright publish"

# Publishes @keploy/playwright to npm from a tag.
#
# To release X.Y.Z: set "version": "X.Y.Z" in playwright/package.json on main
# (a pull request, so the dry run below checks it), then push the tag
# playwright-vX.Y.Z on that commit. The rows run on the tagged commit first;
# the publish runs only when every leg passes, and refuses a tag that does not
# name package.json's version (scripts/release-version.mjs). npm itself
# refuses a version it already has.
#
# Push playwright-vX.Y.Z as a plain git tag, never as a GitHub release: a
# published GitHub release also starts any workflow of this repository that
# runs on releases (the root @keploy/sdk release workflow, #117), which would
# try to publish that package under this tag's name. playwright/README.md,
# "Releasing", says the same.
#
# The package is built and packed once, and that tarball is checked and then
# published, so what ships is what was checked. The license check
# (scripts/license-gate.mjs, as in sdk-publish.yml) installs the tarball as a
# user's `npm install` does and refuses it when anything it installs names a
# license outside its allow-list. test/workflows.test.mjs holds this
# workflow to that, and both of its jobs run those rows first.
#
# On a pull request the same tarball is packed, checked and published as a
# dry run, with no token, so a package that would ship without its build, or
# with a license it may not carry, shows before a tag.
on:
  push:
    tags: ["playwright-v*"]
  pull_request:
    paths:
      - "playwright/**"
      - "scripts/license-gate.mjs"
      - ".github/workflows/playwright-publish.yml"
      - ".github/workflows/playwright-sdk.yml"

permissions:
  contents: read

jobs:
  rows:
    if: github.event_name == 'push'
    uses: ./.github/workflows/playwright-sdk.yml

  publish:
    name: publish to npm
    if: github.event_name == 'push'
    needs: rows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm --provenance signs the package with this run's identity
    defaults:
      run:
        shell: bash # -eo pipefail: a failed command before a pipe fails the step
        working-directory: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes the token line for registry.npmjs.org and pins the @keploy
          # scope to it (@keploy:registry), in the runner's own npmrc.
          registry-url: https://registry.npmjs.org
          scope: "@keploy"
      - name: Workflow rows
        # test/workflows.test.mjs, from the repository's root, so that every
        # tag and pull request this workflow runs on checks that it still
        # publishes only the tarball its Licenses step passed. The root's
        # install, with no scripts, is only for the rows' YAML parser.
        working-directory: .
        run: |
          npm ci --ignore-scripts
          node --test test/workflows.test.mjs
      - name: The tag names package.json's version
        run: node scripts/release-version.mjs "$GITHUB_REF_NAME"
      - name: The npm token is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NPM_TOKEN" || { echo "::error::the NPM_TOKEN secret is not set; refusing to publish"; exit 1; }
      - name: The @keploy scope publishes to registry.npmjs.org
        # npm sends a scoped package to its scope's registry, whatever
        # --registry says. Read the setting npm will use, with every npmrc in
        # it (a project one included), and refuse any other.
        run: |
          got=$(npm config get @keploy:registry)
          test "$got" = https://registry.npmjs.org/ || { echo "::error::@keploy:registry is '$got', not https://registry.npmjs.org/; refusing to publish"; exit 1; }
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Pack
        id: pack
        run: |
          name=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          test -f "$RUNNER_TEMP/$name" || { echo "::error::npm pack wrote no $name"; exit 1; }
          echo "tarball=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
      - name: The package carries its build
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/files.txt"
          for f in dist/index.js dist/index.d.ts package.json README.md; do
            grep -qx "package/$f" "$RUNNER_TEMP/files.txt" || { echo "::error::the package would ship without $f"; exit 1; }
          done
      - name: Licenses
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node ../scripts/license-gate.mjs "$TARBALL"
      - name: The token authenticates
        # Fails here, named, on a token that is expired, revoked or pasted
        # with a stray character, before anything is uploaded.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry https://registry.npmjs.org/
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --provenance

  dry-run:
    name: publish dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # -eo pipefail: a failed command before a pipe fails the step
        working-directory: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Workflow rows
        # test/workflows.test.mjs, from the repository's root, so that every
        # tag and pull request this workflow runs on checks that it still
        # publishes only the tarball its Licenses step passed. The root's
        # install, with no scripts, is only for the rows' YAML parser.
        working-directory: .
        run: |
          npm ci --ignore-scripts
          node --test test/workflows.test.mjs
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Pack
        id: pack
        run: |
          name=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          test -f "$RUNNER_TEMP/$name" || { echo "::error::npm pack wrote no $name"; exit 1; }
          echo "tarball=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
      - name: The package carries its build
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/files.txt"
          for f in dist/index.js dist/index.d.ts package.json README.md; do
            grep -qx "package/$f" "$RUNNER_TEMP/files.txt" || { echo "::error::the package would ship without $f"; exit 1; }
          done
      - name: Licenses
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node ../scripts/license-gate.mjs "$TARBALL"
      - name: Publish, dry run
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --dry-run --access public
